name: Build V4 Docker images
on:
  pull_request:
    branches: [Development-v4]
  push:
    branches: [Development-v4]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v4-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set lowercase image repository
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app and publish on branch push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:v4
            ${{ env.IMAGE }}:v4-${{ github.sha }}
          cache-from: type=gha,scope=v4-app
          cache-to: type=gha,mode=max,scope=v4-app
      - name: Build migration image and publish on branch push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:v4-migrate
            ${{ env.IMAGE }}:v4-migrate-${{ github.sha }}
          cache-from: type=gha,scope=v4-migrator
          cache-to: type=gha,mode=max,scope=v4-migrator
